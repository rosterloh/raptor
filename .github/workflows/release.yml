name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/upload GitHub Releases

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the single source of truth: this installs the
      # pinned toolchain plus its components and targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5

      # `dx build` writes the console bundle to
      # target/dx/raptor-ui/release/web/public, which the `embed-ui` feature
      # embeds; cargo-deb then builds `raptor` in release with the embed-ui and
      # otel features (per [package.metadata.deb] in raptor/Cargo.toml).
      - run: mise run deb
      - run: ls -la target/debian/

      - name: Attach .deb to the release
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
          fail_on_unmatched_files: true
