name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/upload GitHub Releases

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the single source of truth: this installs the
      # pinned toolchain plus its components and targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5

      # `dx build` writes the console bundle to
      # target/dx/raptor-ui/release/web/public, which the `embed-ui` feature
      # embeds; cargo-deb then builds `raptor` in release with the embed-ui and
      # otel features (per [package.metadata.deb] in raptor/Cargo.toml).
      - run: mise run deb
      - run: ls -la target/debian/

      - name: Attach .deb to the release
        uses: softprops/action-gh-release@v3
        with:
          files: target/debian/*.deb
          fail_on_unmatched_files: true

  # Standalone raptorctl archives, named so mise's `github:` backend picks the
  # right one per platform. Runs after `deb` so the release already exists.
  raptorctl:
    needs: deb
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Each runner builds its own host target, so target/release is the output.
      - run: RUSTFLAGS="--remap-path-prefix=$HOME=~" cargo build --release -p raptor-cli --bin raptorctl
      - name: Package
        run: |
          name="raptorctl-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C target/release raptorctl
          shasum -a 256 "$name" > "$name.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: raptorctl-*.tar.gz*
          fail_on_unmatched_files: true
