name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # mdbook is in install-action's own manifest, so it downloads a known
      # release asset (checksum-verified) instead of querying api.github.com to
      # resolve one. Plain `cargo binstall` did resolve through the API
      # unauthenticated, which shares a 60/hour limit per runner IP across all
      # of Actions — that 403'd and failed this job on #114, and on runs 44, 46
      # and 47 before it. Matches the nextest install in ci.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  # Publish to GitHub Pages only from main (requires Pages enabled on the repo).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
