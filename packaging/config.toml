# raptor configuration — installed at /etc/raptor/config.toml
#
# IMPORTANT: before first start, set a real admin password hash and choose a
# DDI auth mode, then start the service:
#
#     raptor hash-password        # type a password, paste the hash below
#     systemctl start raptor
#
# This file is a dpkg conffile: your edits are preserved across package upgrades.
#
# It is world-readable (the service runs as an unprivileged DynamicUser). Keep
# plaintext secrets out of here: put them in the root-only /etc/raptor/raptor.env
# as environment overrides, e.g.
#     RAPTOR_DDI__GATEWAY_TOKEN=super-secret
# which the systemd unit loads before dropping privileges.

bind = "0.0.0.0:8088"

# SQLite by default (created on first start). For Postgres, use e.g.
# database_url = "postgres://user:pass@localhost/raptor"
database_url = "sqlite:///var/lib/raptor/raptor.db?mode=rwc"

# Content-addressed artifact blobs. Lives under the service's StateDirectory
# (/var/lib/raptor), created and owned automatically by systemd on start.
artifact_dir = "/var/lib/raptor/artifacts"

# External base URL used in _links; derived from the Host header when unset.
# url = "https://raptor.example.com"

# Maximum artifact upload size in bytes (default 1 GiB).
# max_artifact_size = 1073741824
# Tenant name devices use in the DDI /{tenant}/controller/v1/... path (matched
# case-insensitively); any other tenant gets 404.
# tenant = "DEFAULT"
# How often the rollout evaluator and target-filter auto-assign sweep run.
# rollout_eval_interval_secs = 5
# Gate new rollouts behind an operator approval before they can start.
# rollout_approval_enabled = false

[ddi]
# Device-facing DDI API auth. Leave anonymous = false in production; devices
# authenticate with a per-target security token or the shared gateway token.
anonymous = false
# gateway_token = "change-me"
polling_interval = "00:05:00"
# confirmation_flow = true   # require confirmation before a deployment starts
# auto_confirm_default = true  # ...but don't strand clients lacking confirmationBase
# Plain-HTTP base for the DDI `download-http` artifact links, if you want device
# downloads to bypass TLS. Only set this when plain HTTP is actually reachable —
# devices follow the link as given. Unset, `download-http` reuses `url` above.
# artifact_http_url = "http://ota.example.com"
# Where to read a device's address from when raptor runs behind a reverse proxy.
# Unset, the socket peer is used -- a device can put anything in this header, so
# only set it when a proxy you control rewrites it.
# trusted_proxy_header = "x-forwarded-for"

[mgmt]
# Management API / web console admin credentials.
username = "admin"
# Replace with the output of `raptor hash-password`:
password_hash = "REPLACE_WITH_ARGON2_HASH"

# Artifact blob storage. Omit to keep blobs on local disk under artifact_dir.
# For an S3-compatible bucket (AWS, RustFS, MinIO, Garage, ...), put the secret
# in raptor.env as RAPTOR_STORAGE__S3__SECRET_KEY rather than here. To move an
# existing store, run `raptor storage-backfill` before switching backend.
# [storage]
# backend = "s3"                        # "fs" (default) or "s3"
# [storage.s3]
# endpoint = "https://s3.example.com:9000"
# bucket = "raptor"                     # must already exist
# access_key = "raptor"
# region = "us-east-1"
# prefix = ""                           # e.g. "raptor/"
# path_style = true                     # false for AWS virtual-hosted buckets
# ca_cert = "/etc/raptor/s3-ca.pem"     # extra CA(s) for a private/self-signed endpoint
# part_size = 16777216                  # multipart part size, minimum 5 MiB

# Per-entity growth caps, mirroring hawkBit's quotas and defaults. A breach is
# rejected with 429. Set a key to 0 to disable that quota.
# [quota]
# max_status_entries_per_action = 1000
# max_messages_per_action_status = 50
# max_attribute_entries_per_target = 100
# max_metadata_entries_per_target = 100
# max_metadata_entries_per_software_module = 100
# max_metadata_entries_per_distribution_set = 100
# max_artifacts_per_software_module = 50
# max_software_modules_per_distribution_set = 100
# max_rollout_groups_per_rollout = 500
# max_targets_per_rollout_group = 20000

# Automatic deletion of closed actions and their status history. Off by default.
# [cleanup]
# enabled = true
# action_expiry_days = 30
# action_statuses = ["finished", "error", "canceled"]
# interval_secs = 3600

# Release retention: keep the newest keep_releases distribution sets of each
# name and hard-delete older ones with their artifacts. Unset keeps everything.
# [retention]
# keep_releases = 5
# interval_secs = 3600

# OpenTelemetry (OTLP) export of traces, metrics and logs. Requires a build with
# the `otel` feature (the stock package omits it); when the section is absent,
# raptor logs to stdout only, exactly as before. See README "Observability".
# [otel]
# endpoint = "http://localhost:4317"   # OTLP endpoint; its presence enables export
# service_name = "raptor"
# protocol = "grpc"                     # "grpc" (4317) or "http" (4318)
# sample_ratio = 0.1                    # sample 10% of new traces; default: all
# [otel.headers]                        # optional, for authenticated collectors
# authorization = "Bearer change-me"
