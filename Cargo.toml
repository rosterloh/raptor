[workspace]
members = ["raptor", "raptor-api-types", "raptor-ui", "raptor-cli", "migration"]
default-members = ["raptor", "raptor-api-types", "raptor-cli", "migration"]
resolver = "3"

# Inherited by members via `<field>.workspace = true`.
[workspace.package]
version = "1.3.1"
edition = "2024"
# Floor set by the Yocto release we ship in (blacksail, Rust 1.98.1).
rust-version = "1.98.1"
# The crates.io name `raptor` belongs to an unrelated crate, and the other
# members are internal — nothing here is publishable. Distribution is the .deb
# built by cargo-deb (see raptor/Cargo.toml `[package.metadata.deb]`).
publish = false

[profile.dev]
debug = "line-tables-only"

# Whole-program optimisation for the shipped binary; costs release build time.
[profile.release]
lto = "fat"
codegen-units = 1
