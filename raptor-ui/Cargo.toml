[package]
name = "raptor-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { version = "=0.7.10", features = ["web", "router"] }
raptor-api-types = { path = "../raptor-api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
console_error_panic_hook = "0.1"
tw_merge = "0.1"
# Not on crates.io (only a 0.0.0 placeholder there); pinned so the vendored
# ColorPicker in src/components/ui/color_picker.rs keeps matching it.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", features = ["web"] }
palette = { version = "0.7.7", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Document", "XmlHttpRequest", "XmlHttpRequestUpload",
    "ProgressEvent", "FormData", "Blob", "EventSource", "MessageEvent",
] }
