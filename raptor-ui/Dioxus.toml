[application]
name = "raptor-ui"
default_platform = "web"

[web.app]
title = "raptor"
base_path = "ui"

# dev loop, both from the repo root: `dx serve --package raptor-ui` +
# `cargo run -- serve --config raptor.toml` → API calls proxied
[[web.proxy]]
backend = "http://localhost:8088/rest"

[tailwind]
input = "tailwind.css"
output = "assets/tailwind.css"
