[package]
name = "raptor-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "CLI and TUI client for raptor's Management API"

[[bin]]
name = "raptorctl"
path = "src/main.rs"

[dependencies]
raptor-api-types = { path = "../raptor-api-types" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
directories = "6"
rpassword = "7"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
